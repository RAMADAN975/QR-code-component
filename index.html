<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <style>
      body {
        background-color: #d5e1ef;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      .main {
        padding: 4.5rem;
        display: flex;
        justify-content: center;
      }
      .main .card {
        padding: 1rem;
        background-color: #ffffff;
        width: 25%;
        border-radius: 1rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding-bottom: 40px;
      }
      .main .card img {
        width: 100%;
        border-radius: 1rem;
      }

      .main .card h2 {
        max-width: 90%;
        margin: 0 auto;
        text-align: center;
        color: hsl(218, 44%, 22%);
      }

      .main .card p {
        max-width: 80%;
        margin: 0 auto;
        text-align: center;
        color: hsl(216, 15%, 48%);
        font-size: 15px;
      }
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      @media (max-width: 992px) {
        .main {
          padding: 2rem;
        }
        .main .card {
          width: 90%;
          max-width: 270px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="card">
        <img src="assets/image-qr-code (2).png" alt="qr-code" />

        <h2>Improve your front-end skills by building projects</h2>

        <p>
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
